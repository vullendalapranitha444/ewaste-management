<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit E-Waste - EcoRecycle</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>

    <div class="logo">
        ♻️ EcoRecycle
    </div>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">Dashboard</a>

        <a href="{{ url_for('pickup') }}">Pickup</a>

        <a href="{{ url_for('rewards') }}">Rewards</a>

        <a href="{{ url_for('history') }}">History</a>

        <a href="{{ url_for('logout') }}">Logout</a>

    </div>

</nav>


<div class="form-container">

    <h1>♻️ Submit E-Waste</h1>

    <p>
        Enter your e-waste details and schedule a pickup.
    </p>


    <form method="POST">

        <label>E-Waste Type</label>

        <select name="waste_type" required>

            <option value="">
                Select E-Waste Type
            </option>

            <option value="Mobile Phone">
                📱 Mobile Phone
            </option>

            <option value="Laptop">
                💻 Laptop
            </option>

            <option value="Computer">
                🖥️ Computer
            </option>

            <option value="Television">
                📺 Television
            </option>

            <option value="Battery">
                🔋 Battery
            </option>

            <option value="Printer">
                🖨️ Printer
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            min="1"
            placeholder="Enter quantity"
            required
        >


        <label>Pickup Location</label>

        <textarea
            name="location"
            placeholder="Enter your complete pickup address"
            required
        ></textarea>


        <label>Pickup Date</label>

        <input
            type="date"
            name="pickup_date"
            id="pickup_date"
            required
        >


        <button type="submit">
            Request Pickup
        </button>

    </form>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
